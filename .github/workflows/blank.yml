name: Build SukiSU Emulator Kernel (android15-6.6 arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest   # x86_64 runner — toolchain sorunu burada yok
    steps:
      - name: Disk aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h

      - name: Bağımlılıklar + repo aracı
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 python-is-python3 \
                                  bc bison flex libssl-dev ccache
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  ci
          git config --global user.email ci@ci

      - name: Kernel kaynağını çek (android15-6.6)
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
                    -b common-android15-6.6
          repo sync -c -j$(nproc) --no-tags --fail-fast

      - name: SukiSU-Ultra entegrasyonu
        working-directory: kernel/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: GKI build ayarları
        working-directory: kernel
        run: |
          # CONFIG_KSU Kconfig'te "default y" (KPROBES && EXT4_FS GKI'de zaten açık),
          # gki_defconfig'e eklemek savedefconfig'te düşer -> "savedefconfig does not match".
          # Bu yüzden defconfig'e dokunmuyoruz; yine de check_defconfig'i kapatıyoruz.
          sed -i 's/check_defconfig//' common/build.config.gki
          # Sürüm dizesinde "-dirty" olmasın.
          sed -i '/stable_scmversion_cmd/s/-maybe-dirty//' build/kernel/kleaf/impl/stamp.bzl || true
          df -h

      - name: GKI kernel derle (arm64, 4k)
        working-directory: kernel
        run: |
          tools/bazel run --config=fast --lto=thin //common:kernel_aarch64_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/dist"

      - name: KernelSU'nun gömülü olduğunu doğrula
        run: |
          ls -la dist
          strings dist/Image | grep -m3 -i kernelsu || { echo "KernelSU Image içinde bulunamadı"; exit 1; }

      - name: Virtual device modülleri derle (arm64)
        working-directory: kernel
        continue-on-error: true
        run: |
          tools/bazel run --config=fast --lto=thin //common-modules/virtual-device:virtual_device_aarch64_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/dist"

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: emulator-kernel-arm64
          path: |
            dist/Image
            dist/*.ko
            dist/initramfs.img
          if-no-files-found: warn
