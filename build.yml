name: Build SukiSU Emulator Kernel (android15-6.6 arm64)

on:
  workflow_dispatch:
    inputs:
      susfs:
        description: "SUSFS entegre et (susfs-main). false = düz SukiSU, daha yüksek başarı şansı"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest   # x86_64 runner — toolchain sorunu burada yok
    steps:
      - name: Disk aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h

      - name: Bağımlılıklar + repo aracı
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 python-is-python3 \
                                  bc bison flex libssl-dev ccache
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  ci
          git config --global user.email ci@ci

      - name: Kernel kaynağını çek (android15-6.6)
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
                    -b common-android15-6.6
          repo sync -c -j$(nproc) --no-tags --fail-fast

      - name: SukiSU-Ultra entegrasyonu
        working-directory: kernel/common
        run: |
          if [ "${{ inputs.susfs }}" = "true" ]; then
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          else
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          fi

      - name: Config'leri aç
        working-directory: kernel
        run: |
          cfg=common/arch/arm64/configs/gki_defconfig
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KPROBES=y"          # kprobe hook (GKI default), CONFIG_KSU_MANUAL_HOOK KAPALI kalsın
          } >> "$cfg"
          if [ "${{ inputs.susfs }}" = "true" ]; then
            {
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            } >> "$cfg"
          fi

      - name: GKI kernel derle (arm64, 4k)
        working-directory: kernel
        run: |
          tools/bazel run --config=fast //common:kernel_aarch64_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/dist"

      - name: Virtual device modülleri derle (arm64)
        working-directory: kernel
        run: |
          tools/bazel run --config=fast //common-modules/virtual-device:virtual_device_aarch64_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/dist"

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: emulator-kernel-arm64
          path: |
            dist/Image
            dist/*.ko
            dist/initramfs.img
          if-no-files-found: warn
